name: image

# Built by the in-cluster Gitea Actions runner. The image is only built, never
# pushed: it proves a base-image or Jekyll hop still builds.
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # ZOT_USERNAME/ZOT_PASSWORD are Gitea org-level secrets. zot has no
      # anonymous read and the Dockerfile base comes through its docker-hub
      # proxy, so the login is needed on pull requests too. It runs before
      # setup-buildx, which pulls the buildkit image from zot.
      - name: Log in to zot
        uses: docker/login-action@v4
        with:
          registry: zot.jamet.me
          username: ${{ secrets.ZOT_USERNAME }}
          password: ${{ secrets.ZOT_PASSWORD }}

      # Docker Hub rate-limits (429) the runners, so buildkit comes from zot.
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=zot.jamet.me/docker-hub/moby/buildkit:buildx-stable-1

      # amd64 only: the runner pins itself to amd64 nodes and has no binfmt.
      # No cache-from/to type=gha: the runner has no cache backend.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: docker-jekyll:ci

      - name: Smoke test
        run: docker run --rm docker-jekyll:ci --version
